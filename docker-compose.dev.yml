services:
  redis:
    container_name: redis
    image: redis:8.10.0-alpine
    ports:
      - 6379:6379
    restart: on-failure
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - template-server-network

  server-dev:
    depends_on:
      redis:
        condition: service_healthy
    container_name: template-server-dev
    build:
      context: .
      dockerfile: Dockerfile.Dev
    restart: on-failure
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - 8080:8080
    environment:
      - NODE_ENV=development
      - PORT=8080
      - REDIS_HOST=redis
    env_file:
      - .env
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:8080/api/v1/health'').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - template-server-network

networks:
  template-server-network:
    driver: bridge

volumes:
  redis-data:
